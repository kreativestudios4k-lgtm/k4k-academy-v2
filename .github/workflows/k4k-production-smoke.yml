name: K4K Production Route Watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: k4k-public-smoke
  cancel-in-progress: false

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check public K4K routes (GET only)
        run: node scripts/smoke-live.mjs
      - name: Open a deduplicated release incident on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const title='K4K production public-route smoke failed';
            const {data:issues}=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const existing=issues.find(issue=>issue.title===title && !issue.pull_request);
            if(!existing){
              await github.rest.issues.create({owner,repo,title,body:'A read-only public route check failed. Review this workflow run before shipping additional changes: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId+'. No generation or credits were touched.'});
            }
      - name: Close an outstanding incident once healthy
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const title='K4K production public-route smoke failed';
            const {data:issues}=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const existing=issues.find(issue=>issue.title===title && !issue.pull_request);
            if(existing){
              await github.rest.issues.createComment({owner,repo,issue_number:existing.number,body:'Automated public route checks recovered in workflow run '+context.runId+'.'});
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }
